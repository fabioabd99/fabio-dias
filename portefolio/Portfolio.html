<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Fábio Dias — Portefólio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #root { width: 100%; height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
function FrameEmbed({ src, w, h }) {
  return (
    <iframe
      src={src}
      style={{ width: w, height: h, border: 'none', display: 'block', background: '#fff' }}
      loading="lazy"
    />
  );
}

function App() {
  return (
    <DesignCanvas
      title="Portefólio · Fábio Dias"
      subtitle="Homepage + 5 páginas de projeto. Abre cada uma em fullscreen — scroll, toggle PT/EN, hovers, formulário, navegação prev/next."
    >
      <DCSection id="home" title="Homepage" subtitle="A página principal — hero, sobre, stack, projetos, experiência, contacto. Clica nos projetos para abrires as páginas individuais.">
        <DCArtboard id="home-desktop" label="Homepage · Desktop" width={1280} height={820}>
          <FrameEmbed src="variations/brutalist.html" w={1280} h={820} />
        </DCArtboard>
        <DCArtboard id="home-mobile" label="Homepage · Mobile" width={390} height={820}>
          <FrameEmbed src="variations/brutalist.html" w={390} h={820} />
        </DCArtboard>
      </DCSection>

      <DCSection id="projects" title="Páginas de Projeto" subtitle="Cada projeto tem a sua página dedicada — problema, solução, stack, resultados, navegação prev/next.">
        <DCArtboard id="p1" label="01 · Lorem Commerce" width={1280} height={820}>
          <FrameEmbed src="projects/project-1.html" w={1280} h={820} />
        </DCArtboard>
        <DCArtboard id="p2" label="02 · Pixel Dashboard" width={1280} height={820}>
          <FrameEmbed src="projects/project-2.html" w={1280} h={820} />
        </DCArtboard>
        <DCArtboard id="p3" label="03 · BookFlow CMS" width={1280} height={820}>
          <FrameEmbed src="projects/project-3.html" w={1280} h={820} />
        </DCArtboard>
        <DCArtboard id="p4" label="04 · TaskNova" width={1280} height={820}>
          <FrameEmbed src="projects/project-4.html" w={1280} h={820} />
        </DCArtboard>
        <DCArtboard id="p5" label="05 · GreenAPI" width={1280} height={820}>
          <FrameEmbed src="projects/project-5.html" w={1280} h={820} />
        </DCArtboard>
      </DCSection>

      <DCSection id="projects-mobile" title="Projetos · Mobile" subtitle="As páginas de projeto também totalmente responsivas.">
        <DCArtboard id="pm1" label="01 · Mobile" width={390} height={820}>
          <FrameEmbed src="projects/project-1.html" w={390} h={820} />
        </DCArtboard>
        <DCArtboard id="pm2" label="02 · Mobile" width={390} height={820}>
          <FrameEmbed src="projects/project-2.html" w={390} h={820} />
        </DCArtboard>
        <DCArtboard id="pm3" label="03 · Mobile" width={390} height={820}>
          <FrameEmbed src="projects/project-3.html" w={390} h={820} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
